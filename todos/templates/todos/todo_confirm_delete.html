<!DOCTYPE html>
<html>
<head>
    <title>Delete To-Do</title>
</head>
<body>
    <h2>Delete To-Do</h2>
    <p>Are you sure you want to delete "{{ todo.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'todo_list' %}">Cancel</a>
    </form>
</body>
</html>
